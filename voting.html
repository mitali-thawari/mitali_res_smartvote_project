    <!-- ================= NAVBAR ================= -->

    <section class="voting-section">

        <h1>
            Cast Your Vote
        </h1>

        <p>
            Select your preferred candidate
        </p>


        <div class="voting-box">

            <h2>
                Select Candidate
            </h2>



            <!-- Candidate 1 -->

            <label class="candidate">

                <input type="radio"
                       name="candidate"
                       value="Mitali Thawari">


                <img src="assets/candidate1.jpg"
                     class="candidate-photo"
                     alt="Mitali Thawari">


                <div class="candidate-details">

                    <div class="candidate-name">
                        Mitali Thawari
                    </div>

                    <div class="party">
                        Student Development Party
                    </div>

                </div>


                <img src="assets/party1.png"
                     class="party-logo"
                     alt="Student Development Party">

            </label>



            <!-- Candidate 2 -->

            <label class="candidate">

                <input type="radio"
                       name="candidate"

                <div class="candidate-details">

                    <div class="candidate-name">
                        Aditya Raj
                    </div>

                    <div class="party">

            </label>

            <!-- Candidate 4 -->

            <label class="candidate">

                <input type="radio"
                       name="candidate"

                <img src="assets/candidate4.jpg"
                     class="candidate-photo"

                <div class="candidate-details">

                    <div class="candidate-name">
                        Snehal Tajne
                    </div>

                    <div class="party">
                        People's Party

                <img src="assets/party4.png"

            <label class="candidate">

                <input type="radio"
                       name="candidate"
                       value="Sanket Thawari">


                <img src="assets/pfp3_d7855f9562.jpg"
