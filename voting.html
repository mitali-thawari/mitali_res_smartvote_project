    <!DOCTYPE html>
<html>
<head>
    <title>SmartVote - Voting</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="voting-section">

    <h1>Cast Your Vote</h1>
    <p>Select your preferred candidate</p>

    <div class="voting-box">

        <h2>Select Candidate</h2>

        <label class="candidate">
            <input type="radio" name="candidate">
            <div>
                <div class="candidate-name">Candidate 1</div>
                <div class="party">Development Party</div>
            </div>
        </label>

        <label class="candidate">
            <input type="radio" name="candidate">
            <div>
                <div class="candidate-name">Candidate 2</div>
                <div class="party">Progress Party</div>
            </div>
        </label>

        <label class="candidate">
            <input type="radio" name="candidate">
            <div>
                <div class="candidate-name">Candidate 3</div>
                <div class="party">Unity Party</div>
            </div>
        </label>

        <button class="vote-btn">Vote Now</button>

    </div>

</section>
